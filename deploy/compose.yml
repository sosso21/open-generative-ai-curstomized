# Open Generative AI, WireGuard only: published on 10.13.13.1 (never on the public address, unlike the upstream
# docker-compose.yml which publishes 3001 on every interface). The image is built by setup.sh.
name: ai-open-generative

services:
  app:
    image: ai-open-generative:local
    container_name: ai-open-generative
    restart: unless-stopped
    init: true
    user: "node"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      OUTPUT_DIR: /app/output
    ports:
      - "10.13.13.1:3100:3000"
    read_only: true
    # Generated results (api/outputs) land in the project folder; the only writable path besides the tmpfs.
    volumes:
      - ./Open-Generative-AI/output:/app/output
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=256m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Limits keep the production platform responsive whatever this app does.
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
